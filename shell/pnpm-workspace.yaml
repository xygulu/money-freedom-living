# Capacitor 8 + SPM + pnpm 的兼容解法（2026-11-14）：
# pnpm 默认 isolated 布局，Capacitor CLI 生成的 Package.swift 里本地插件路径会带
# .pnpm/<name>@<version>_<peer-hash> 的**机器相关哈希**——换台机器 pnpm 解析出的哈希
# 不同（甚至同机重装也可能变），SPM 直接解析失败 → Mac 侧构建挂。
# hoisted 布局让 node_modules 变成扁平 npm 样式，路径稳定为 node_modules/@capacitor/xxx。
#
# 注：pnpm 11 起 pnpm 专属设置走本文件（.npmrc 里的 node-linker 不再被读取）。
nodeLinker: hoisted
